name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install test dependencies
        run: python3 -m pip install --requirement requirements-dev.txt
      - name: Compile Python helpers
        run: python3 -m compileall -q animate-roblox-characters/scripts tests
      - name: Run unit and structure tests
        run: python3 -m unittest discover -s tests -v
      - name: Audit bundled toolchain
        run: python3 animate-roblox-characters/scripts/toolchain.py --repository-only
      - name: Audit GIF encoder
        run: python3 animate-roblox-characters/scripts/toolchain.py --audit-pillow
      - name: Check release hygiene
        run: python3 animate-roblox-characters/scripts/privacy_check.py . --allow-contributor-identities
